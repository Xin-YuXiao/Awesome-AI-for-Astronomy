# Awesome AI for Astronomy: list data.
# README.md and the web page are generated from this file by scripts/build.py.
# Paper entry fields: name (optional short name), title, venue, links (label: url), desc.
# Link-list entries (tools, communities, related lists): name, url, desc.
sections:
- title: Surveys and Reviews
  entries:
  - title: 'Machine Learning in Astronomy: A Practical Overview'
    venue: arXiv 2019
    links:
      Paper: https://arxiv.org/abs/1904.07248
    desc: Lecture notes from the IAC Winter School 2018 covering supervised and unsupervised learning for astronomical datasets.
  - title: The Frontier of Simulation-Based Inference
    venue: PNAS 2020
    links:
      Paper: https://arxiv.org/abs/1911.01429
      Journal: https://doi.org/10.1073/pnas.1912789117
    desc: Review of simulation-based inference methods and the role of machine learning in inference with intractable likelihoods.
  - title: Enhancing Gravitational-Wave Science with Machine Learning
    venue: MLST 2021
    links:
      Paper: https://arxiv.org/abs/2005.03745
      Journal: https://doi.org/10.1088/2632-2153/abb93a
    desc: Review of machine learning for LIGO and Virgo data quality, signal modeling, searches and parameter estimation.
  - title: 'The Dawes Review 10: The Impact of Deep Learning for the Analysis of Galaxy Surveys'
    venue: PASA 2023
    links:
      Paper: https://arxiv.org/abs/2210.01813
      Journal: https://doi.org/10.1017/pasa.2022.55
    desc: Review of deep learning applications to galaxy surveys covering classification, property estimation, discovery and cosmological inference.
  - title: 'Astronomia ex machina: A History, Primer and Outlook on Neural Networks in Astronomy'
    venue: R. Soc. Open Sci. 2023
    links:
      Paper: https://arxiv.org/abs/2211.03796
      Journal: https://doi.org/10.1098/rsos.221454
    desc: Historical review of neural networks in astronomy with a primer on deep learning and an outlook on astronomical foundation models.
  - title: Machine Learning for Observational Cosmology
    venue: Rep. Prog. Phys. 2023
    links:
      Paper: https://arxiv.org/abs/2303.15794
      Journal: https://doi.org/10.1088/1361-6633/acd2ea
    desc: Review of machine learning applications in time-domain astronomy, galaxy surveys and emulation for cosmology.
  - title: 'Constructing Impactful Machine Learning Research for Astronomy: Best Practices for Researchers and Reviewers'
    venue: arXiv 2023
    links:
      Paper: https://arxiv.org/abs/2310.12528
    desc: Recommendations on baselines, validation, reproducibility and reporting for machine learning papers in astronomy.
  - title: 'Deep Learning Based Systems for Crater Detection: A Review'
    venue: arXiv 2023
    links:
      Paper: https://arxiv.org/abs/2310.07727
    desc: Review of CNN, U-Net, R-CNN and transformer crater detection algorithms for the Moon, Mars and Mercury.
  - title: What is the Role of Large Language Models in the Evolution of Astronomy Research?
    venue: arXiv 2024
    links:
      Paper: https://arxiv.org/abs/2409.20252
    desc: Use cases, survey results and recommendations on LLM adoption in astronomy research.
  - title: 'Towards Scientific Intelligence: A Survey of LLM-based Scientific Agents'
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2503.24047
    desc: Survey of LLM-based scientific agents with a section on astronomy and cosmology applications.
  - title: 'From AI for Science to Agentic Science: A Survey on Autonomous Scientific Discovery'
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2508.14111
      Code: https://github.com/AgenticScience/Awesome-Agent-Scientists
    desc: Domain-oriented survey of autonomous scientific discovery including agentic astronomy and cosmology research.
  - title: 'A Survey of Scientific Large Language Models: From Data Foundations to Agent Frontiers'
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2508.21148
    desc: Survey of scientific LLMs and their training data, including astronomy datasets and models.
  - title: The Revolution in Strong Lensing Discoveries from Euclid
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2508.14624
    desc: Review of how machine learning, citizen science and expert inspection found about 500 high-quality lens candidates in Euclid Q1.
  - title: Deep Learning in Astrophysics
    venue: ARA&A 2025
    links:
      Paper: https://arxiv.org/abs/2510.10713
    desc: Annual Review covering inductive biases, simulation-based inference, anomaly detection, foundation models, reinforcement learning and LLM agents in astronomy.
  - title: 'Advances and Challenges in Solar Flare Prediction: A Review'
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2511.20465
    desc: Review of statistical, physics-based and deep learning flare forecasting including CNN, LSTM and transformer models.
  - title: Opportunities in AI/ML for the Rubin LSST Dark Energy Science Collaboration
    venue: arXiv 2026
    links:
      Paper: https://arxiv.org/abs/2601.14235
    desc: LSST DESC roadmap covering photometric redshifts, transient classification, weak lensing inference, foundation models and infrastructure.
  - title: 'Deep Learning-Based Astronomical Multimodal Data Fusion: A Comprehensive Review'
    venue: arXiv 2026
    links:
      Paper: https://arxiv.org/abs/2603.00699
    desc: Review of deep learning methods that fuse images, spectra, time series and catalogues in astronomy.
  - title: The Role of Artificial Intelligence in the SKA Era
    venue: arXiv 2026
    links:
      Paper: https://arxiv.org/abs/2606.28493
    desc: Chapter on deep learning for source finding, RFI mitigation, imaging, anomaly detection and scheduling for the SKA.
  - title: Source Finding and Characterisation for SKAO Science
    venue: arXiv 2026
    links:
      Paper: https://arxiv.org/abs/2607.03736
    desc: Review of classical and machine learning source finding and morphology classification for SKAO surveys.
  - title: Machine Learning and Deep Learning for Exoplanet Detection and Atmospheric Characterization with JWST and the Upcoming Ariel Mission
    venue: arXiv 2026
    links:
      Paper: https://arxiv.org/abs/2606.23766
    desc: Review of machine learning for transit identification, candidate vetting, detrending and atmospheric retrieval, including neural and flow matching posterior estimation, in the context of JWST and Ariel.
  - title: Machine Learning in Gamma Astronomy
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2501.19064
    desc: Review of deep learning methods for Imaging Atmospheric Cherenkov Telescope data, covering gamma-hadron separation, event reconstruction and fast simulation.
- title: Foundation Models and Representation Learning
  subsections:
  - title: Images
    entries:
    - name: SSL-SDSS
      title: Self-Supervised Representation Learning for Astronomical Images
      venue: ApJL 2021
      links:
        Paper: https://arxiv.org/abs/2012.13083
        Code and Models: https://portal.nersc.gov/project/dasrepo/self-supervised-learning-sdss
        Journal: https://doi.org/10.3847/2041-8213/abf2c7
      desc: Contrastive pretraining on about 1.2M SDSS galaxy images, evaluated on morphology classification and photometric redshift estimation.
      modality:
      - Images
    - name: Galaxy Search
      title: Self-Supervised Similarity Search for Large Scientific Datasets
      venue: NeurIPS 2021 Workshop (ML4PS)
      links:
        Paper: https://arxiv.org/abs/2110.13151
        Code: https://github.com/georgestein/galaxy_search
      desc: Self-supervised representations of 42M DESI Legacy Imaging Survey galaxies with a public similarity search tool.
      modality:
      - Images
    - name: Zoobot Representations
      title: Practical Galaxy Morphology Tools from Deep Supervised Representation Learning
      venue: MNRAS 2022
      links:
        Paper: https://arxiv.org/abs/2110.12735
        Journal: https://doi.org/10.1093/mnras/stac525
        Code: https://github.com/mwalmsley/zoobot
      desc: Representations learned from Galaxy Zoo labels reused for similarity search, anomaly finding and new classification tasks.
      modality:
      - Images
    - name: Zoobot FM
      title: Towards Galaxy Foundation Models with Hybrid Contrastive Learning
      venue: ICML 2022 Workshop (ML4Astro)
      links:
        Paper: https://arxiv.org/abs/2206.11927
        Code: https://github.com/mwalmsley/zoobot
      desc: Pretraining galaxy morphology encoders on Galaxy Zoo volunteer responses for transfer to downstream tasks.
      modality:
      - Images
    - name: Zoobot
      title: 'Zoobot: Adaptable Deep Learning Models for Galaxy Morphology'
      venue: JOSS 2023
      links:
        Journal: https://doi.org/10.21105/joss.05312
        Code: https://github.com/mwalmsley/zoobot
        PyPI: https://pypi.org/project/zoobot/
      desc: Pretrained galaxy morphology encoders and finetuning utilities, deployed in the Euclid morphology pipeline.
      modality:
      - Images
    - name: Rare Galaxy Classes
      title: Rare Galaxy Classes Identified In Foundation Model Representations
      venue: arXiv 2023
      links:
        Paper: https://arxiv.org/abs/2312.02910
        Code: https://github.com/mwalmsley/zoobot
      desc: Searches Zoobot representation space for rare morphological classes.
      modality:
      - Images
    - name: Galaxy Scaling Laws
      title: Scaling Laws for Galaxy Images
      venue: arXiv 2024
      links:
        Paper: https://arxiv.org/abs/2404.02973
        Code: https://github.com/mwalmsley/zoobot
      desc: Supervised scaling study on 840k galaxy images with over 100M Galaxy Zoo annotations.
      modality:
      - Images
    - name: AstroPT
      title: 'AstroPT: Scaling Large Observation Models for Astronomy'
      venue: ICML 2024 Workshop (AI4Science)
      links:
        Paper: https://arxiv.org/abs/2405.14930
        Euclid Paper: https://arxiv.org/abs/2503.15312
        Code: https://github.com/Smith42/astroPT
        Model: https://huggingface.co/Smith42/astroPT_v2.0
      desc: Autoregressive transformers from 1M to 2.1B parameters pretrained on 8.6M DESI Legacy Survey galaxy images.
      modality:
      - Images
    - name: Gestalt
      title: 'Gestalt: A Meta-Foundation Model for Astronomy'
      venue: NeurIPS 2026 Workshop (Interpretability for Discovery)
      links:
        Paper: https://arxiv.org/abs/2609.38312
      desc: Combines frozen embeddings of 22 foundation models from eight families by whitening and randomised SVD, outperforming every member on 19 of 21 metrics for HSC, JWST and Legacy Survey galaxies.
      modality:
      - Images
  - title: Spectra
    entries:
    - name: SDSS-VAE
      title: Dimensionality Reduction of SDSS Spectra with Variational Autoencoders
      venue: AJ 2020
      links:
        Paper: https://arxiv.org/abs/2002.10464
        Journal: https://doi.org/10.3847/1538-3881/ab9644
        Code: https://github.com/stephenportillo/SDSS-VAE
      desc: Variational autoencoder compression of SDSS galaxy spectra into a low-dimensional latent space.
      modality:
      - Spectra
    - name: Cycle-StarNet
      title: 'Cycle-StarNet: Bridging the Gap between Theory and Data by Leveraging Large Data Sets'
      venue: ApJ 2021
      links:
        Paper: https://arxiv.org/abs/2007.03109
        Code: https://github.com/teaghan/Cycle_SN
        Journal: https://doi.org/10.3847/1538-4357/abca96
      desc: Domain adaptation between synthetic and observed stellar spectra with cycle-consistent networks.
      modality:
      - Spectra
    - name: spender
      title: 'Autoencoding Galaxy Spectra I: Architecture'
      venue: AJ 2023
      links:
        Paper: https://arxiv.org/abs/2211.07890
        Code: https://github.com/pmelchior/spender
        Journal: https://doi.org/10.3847/1538-3881/ace0ff
      desc: Attentive convolutional autoencoder that models galaxy spectra in the rest frame with explicit redshifting and resampling, trained on SDSS-II.
      modality:
      - Spectra
    - name: Stellar FM
      title: Towards an Astronomical Foundation Model for Stars with a Transformer-Based Model
      venue: MNRAS 2024
      links:
        Paper: https://arxiv.org/abs/2308.10944
        Code: https://github.com/henrysky/astroNN_stars_foundation
      desc: Transformer trained on cross-survey APOGEE, Gaia and 2MASS data that performs discriminative and generative stellar tasks without task-specific finetuning.
      modality:
      - Spectra
      - Tabular
    - name: SpectraFM
      title: 'SpectraFM: Tuning into Stellar Foundation Models'
      venue: NeurIPS 2024 Workshop (FM4Science)
      links:
        Paper: https://arxiv.org/abs/2411.04750
      desc: Transformer pretrained on synthetic stellar spectra and transferred to real spectra across wavelength ranges.
      modality:
      - Spectra
    - title: Applying Vision Transformers on Spectral Analysis of Astronomical Objects
      venue: arXiv 2025
      links:
        Paper: https://arxiv.org/abs/2506.00294
      desc: Converts one-dimensional spectra into images for pretrained ViT backbones in classification and regression.
      modality:
      - Spectra
    - name: SpecCLIP
      title: 'SpecCLIP: Aligning and Translating Spectroscopic Measurements for Stars'
      venue: arXiv 2025
      links:
        Paper: https://arxiv.org/abs/2507.01939
        LoRA Fine-tuning: https://arxiv.org/abs/2507.20972
      desc: Contrastive alignment of LAMOST low-resolution and Gaia XP spectra foundation models for parameter estimation and cross-spectrum prediction.
      modality:
      - Spectra
    - name: OmniSpectra
      title: 'OmniSpectra: A Unified Foundation Model for Universal Spectra Representation Learning'
      venue: arXiv 2026
      links:
        Paper: https://arxiv.org/abs/2601.15351
      desc: Masked-modeling transformer pretrained on 5.5 million spectra from eight surveys at native resolution.
      modality:
      - Spectra
    - title: Universal Spectral Tokenization via Self-Supervised Panchromatic Representation Learning
      venue: arXiv 2025
      links:
        Paper: https://arxiv.org/abs/2510.17959
      desc: Transformer tokenizer that reads spectra on their native wavelength grids, pretrained on SDSS, DESI, GALAH and APOGEE and adapted to object classification and stellar parameter regression.
      modality:
      - Spectra
  - title: Time Series
    entries:
    - title: Domain-Informed Multi-View Self-Distillation for Astronomical Light-Curve Representation Learning with JEPA
      venue: arXiv 2026
      links:
        Paper: https://arxiv.org/abs/2606.28446
        Code: https://github.com/ruiyicheng/domain-informed-lightcurve-jepa
        Model: https://huggingface.co/ruiyicheng/domain-informed-lightcurve-jepa-exp21
      desc: Domain-informed JEPA combines raw, periodogram and phase-folded light-curve views with uncertainty-aware tokenization and multi-view self-distillation, trained on LEAVES and evaluated on StarEmbed and 12 irregular time-series datasets.
      modality:
      - Time series
    - name: ASTROMER
      title: 'ASTROMER: A Transformer-Based Embedding for the Representation of Light Curves'
      venue: A&A 2023
      links:
        Paper: https://arxiv.org/abs/2205.01677
        Code: https://github.com/astromer-science
        Journal: https://doi.org/10.1051/0004-6361/202243928
        Astromer 2: https://arxiv.org/abs/2502.02717
      desc: Self-supervised light-curve encoder pretrained with masked magnitude prediction on MACHO R-band data.
      modality:
      - Time series
    - name: Astroconformer
      title: 'Astroconformer: The Prospects of Analyzing Stellar Light Curves with Transformer-Based Deep Learning Models'
      venue: MNRAS 2024
      links:
        Paper: https://arxiv.org/abs/2309.16316
        Journal: https://doi.org/10.1093/mnras/stae068
        Workshop Version: https://arxiv.org/abs/2207.02787
      desc: Conformer model for Kepler light curves that infers surface gravity and frequency of maximum oscillation power.
      modality:
      - Time series
    - name: Maven
      title: 'Maven: A Multimodal Foundation Model for Supernova Science'
      venue: MLST 2024
      links:
        Paper: https://arxiv.org/abs/2408.16829
        Code: https://github.com/ThomasHelfer/multimodal-supernovae
      desc: Contrastive alignment of supernova photometry and spectroscopy, pretrained on 0.5M synthetic events and finetuned on ZTF.
      modality:
      - Spectra
      - Time series
    - name: FALCO
      title: 'FALCO: A Foundation Model of Astronomical Light Curves for Time Domain Astronomy'
      venue: arXiv 2025
      links:
        Paper: https://arxiv.org/abs/2504.20290
      desc: Self-supervised transformer on Kepler light curves for variability classification, surface gravity estimation and flare identification.
      modality:
      - Time series
    - title: What Does Self-supervision Add to Engineered Features for Stellar Light Curves?
      venue: arXiv 2026
      links:
        Paper: https://arxiv.org/abs/2610.14283
      desc: Measures the information that self-supervised light-curve encoders add beyond engineered periodogram and variability features.
      modality:
      - Time series
  - title: Multimodal
    entries:
    - name: AstroCLIP
      title: 'AstroCLIP: A Cross-Modal Foundation Model for Galaxies'
      venue: MNRAS 2024
      links:
        Paper: https://arxiv.org/abs/2310.03024
        Code: https://github.com/PolymathicAI/AstroCLIP
        Journal: https://doi.org/10.1093/mnras/stae1450
      desc: Contrastive alignment of DESI galaxy images and spectra in a shared embedding space.
      modality:
      - Images
      - Spectra
    - name: MPP
      title: Multiple Physics Pretraining for Physical Surrogate Models
      venue: NeurIPS 2024
      links:
        Paper: https://arxiv.org/abs/2310.02994
        Code: https://github.com/PolymathicAI/multiple_physics_pretraining
      desc: Autoregressive pretraining of a single surrogate model across heterogeneous physical simulation systems.
      modality:
      - Simulations
    - name: PAPERCLIP
      title: 'PAPERCLIP: Associating Astronomical Observations and Natural Language with Multi-Modal Models'
      venue: COLM 2024
      links:
        Paper: https://arxiv.org/abs/2403.08851
        Code: https://github.com/smsharma/PAPERCLIP-Hubble
      desc: CLIP finetuned on Hubble Space Telescope observations paired with observing proposal abstracts.
      modality:
      - Images
      - Text
    - name: AstroM3
      title: 'AstroM3: A Self-Supervised Multimodal Model for Astronomy'
      venue: arXiv 2024
      links:
        Paper: https://arxiv.org/abs/2411.08842
        Code: https://github.com/MeriDK/AstroM3
      desc: Trimodal CLIP-style pretraining on variable-star light curves, spectra and metadata.
      modality:
      - Spectra
      - Time series
      - Tabular
    - name: AION-1
      title: 'AION-1: Omnimodal Foundation Model for Astronomical Sciences'
      venue: NeurIPS 2025
      links:
        Paper: https://arxiv.org/abs/2510.17960
        Code: https://github.com/PolymathicAI/AION
        Model: https://huggingface.co/polymathic-ai/aion-base
      desc: Token-based masked modeling over 39 modalities from Legacy Survey, HSC, SDSS, DESI and Gaia, released at 300M to 3.1B parameters.
      modality:
      - Images
      - Spectra
      - Tabular
    - title: Self-Supervised Representation Learning for JWST Galaxy Images and Low Resolution Spectra
      venue: NeurIPS 2026 Workshop (RPS)
      links:
        Paper: https://arxiv.org/abs/2610.31078
        Code: https://github.com/2003cy/neurips2026_ssl_jwst
      desc: Joint representation of F150W imaging and 1 to 2 micron PRISM spectra that recovers stellar mass at 1 < z < 3 with R2 of about 0.9, with CLIP alignment improving single-modality inference.
      modality:
      - Images
      - Spectra
- title: Language and Vision-Language Models
  entries:
  - name: astroBERT
    title: Building astroBERT, a Language Model for Astronomy & Astrophysics
    venue: arXiv 2021
    links:
      Paper: https://arxiv.org/abs/2112.00590
      Model: https://huggingface.co/adsabs/astroBERT
    desc: BERT model with 110M parameters trained on NASA ADS papers for named entity recognition and classification.
  - name: AstroLLaMA
    title: 'AstroLLaMA: Towards Specialized Foundation Models in Astronomy'
    venue: IJCNLP-AACL 2023 Workshop (WIESP)
    links:
      Paper: https://arxiv.org/abs/2309.06126
      ACL Anthology: https://aclanthology.org/2023.wiesp-1.7/
      Model: https://huggingface.co/universeTBD
    desc: LLaMA-2-7B finetuned on over 300k astro-ph abstracts.
  - name: AstroLLaMA-Chat
    title: 'AstroLLaMA-Chat: Scaling AstroLLaMA with Conversational and Diverse Datasets'
    venue: arXiv 2024
    links:
      Paper: https://arxiv.org/abs/2401.01916
      Model: https://huggingface.co/universeTBD
    desc: Continual pretraining on abstracts, introductions and conclusions followed by domain conversational finetuning.
  - name: cosmosage
    title: 'cosmosage: A Natural-Language Assistant for Cosmology'
    venue: Astron. Comput. 2025
    links:
      Paper: https://arxiv.org/abs/2407.04420
      Code: https://github.com/tijmen/cosmosage
      Model: https://huggingface.co/Tijmen2/cosmosage-v3.1
      Journal: https://doi.org/10.1016/j.ascom.2025.100934
    desc: Cosmology assistant built by continued pretraining on cosmology papers and textbooks followed by question-answer finetuning.
  - name: AstroLLaMA-2-70B
    title: 'AstroMLab 2: AstroLLaMA-2-70B Model and Benchmarking Specialised LLMs for Astronomy'
    venue: SC 2024 Workshop (AI4S)
    links:
      Paper: https://arxiv.org/abs/2409.19750
      Model: https://huggingface.co/AstroMLab
    desc: Releases AstroLLaMA-3-8B and AstroLLaMA-2-70B and reports that the 7B AstroLLaMA series underperforms its base model.
  - name: AstroSage-8B
    title: 'AstroMLab 3: Achieving GPT-4o Level Performance in Astronomy with a Specialized 8B-Parameter Large Language Model'
    venue: Sci. Rep. 2025
    links:
      Paper: https://arxiv.org/abs/2411.09012
      Model: https://huggingface.co/AstroMLab/AstroSage-8B
      Journal: https://doi.org/10.1038/s41598-025-97131-y
    desc: Llama-3.1-8B with continued pretraining on about 250k astro-ph and gr-qc preprints, SFT and model merging. Scores 80.9% on AstroMLab 1.
  - name: Astro-HEP-BERT
    title: 'Astro-HEP-BERT: A Bidirectional Language Model for Studying the Meanings of Concepts in Astrophysics and High Energy Physics'
    venue: arXiv 2024
    links:
      Paper: https://arxiv.org/abs/2411.14877
      Model: https://huggingface.co/arnosimons/astro-hep-bert
    desc: BERT model adapted to astrophysics and high energy physics literature for concept analysis.
  - name: AstroLLaVA
    title: 'AstroLLaVA: Towards the Unification of Astronomical Data and Natural Language'
    venue: ICLR 2025 Workshop (SCI-FM)
    links:
      Paper: https://arxiv.org/abs/2504.08583
      Code: https://github.com/UniverseTBD/AstroLLaVA
    desc: LLaVA finetuned on about 30k captioned images from APOD, ESO and Hubble for astronomical visual question answering.
  - name: AstroSage-70B
    title: 'AstroMLab 4: Benchmark-Topping Performance in Astronomy Q&A with a 70B-Parameter Domain-Specialized Reasoning Model'
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2505.17592
      Model: https://huggingface.co/AstroMLab/AstroSage-70B-20251009
    desc: Llama-3.1-70B with continued pretraining and reasoning-chain SFT. Scores 89.0% on a validated 3,846-question subset of AstroMLab 1.
  - title: Rethinking Domain Specialization for Open-Ended Scientific Reasoning in Astronomy Language Models
    venue: arXiv 2026
    links:
      Paper: https://arxiv.org/abs/2609.17644
    desc: Evaluates whether continued pretraining and instruction tuning on astronomy corpora help open-ended scientific reasoning.
  - name: Spec-o3
    title: 'Spec-o3: A Tool-Augmented Vision-Language Agent for Rare Celestial Object Candidate Vetting via Automated Spectral Inspection'
    venue: ACL 2026
    links:
      Paper: https://arxiv.org/abs/2601.06498
      ACL Anthology: https://aclanthology.org/2026.acl-long.256/
      Code: https://github.com/Maxwell-Jia/spec-o3
      Model: https://huggingface.co/Maxwell-Jia/spec-o3-7b
      Data: https://huggingface.co/datasets/Maxwell-Jia/SpecVI-Bench
    desc: Tool-using vision-language agent trained with supervised fine-tuning on expert inspection trajectories and outcome-based reinforcement learning, which vets rare-object candidates by iteratively inspecting spectral regions, raising macro-F1 on five LAMOST tasks from 28.3 to 76.5 with transfer to SDSS and DESI.
    note: Oral
- title: Agents and Retrieval Systems
  entries:
  - name: GalaxyWiki
    title: Extracting Published Discussions of 13,616 Galaxies with Language Models
    venue: WASP 2026 Workshop
    links:
      Paper: https://arxiv.org/abs/2611.13118
      ACL Anthology: https://aclanthology.org/2026.wasp-1.19/
      Code: https://github.com/NolanKoblischke/galaxywiki-paper
      Project: https://galaxywiki.nolank.ca/
    desc: GPT-5.5 agents extract source-linked discussions from arXiv papers and coordinate matching groups the evidence into 13,616 galaxy entries.
  - name: pathfinder
    title: 'pathfinder: A Semantic Framework for Literature Review and Knowledge Discovery in Astronomy'
    venue: ApJS 2024
    links:
      Paper: https://arxiv.org/abs/2408.01556
      Demo: https://pfdr.app
    desc: Retrieval-augmented literature search and synthesis over about 350k ADS papers with time and citation weighting.
  - name: cmbagent
    title: Multi-Agent System for Cosmological Parameter Analysis
    venue: arXiv 2024
    links:
      Paper: https://arxiv.org/abs/2412.00431
      Follow-up: https://arxiv.org/abs/2507.07257
      Code: https://github.com/CMBAgents/cmbagent
    desc: Planning and control system of about 30 LLM agents for autonomous cosmological data analysis.
  - name: StarWhisper Telescope
    title: 'StarWhisper Telescope: An AI Framework for Automating End-to-End Astronomical Observations'
    venue: Commun. Eng. 2025
    links:
      Paper: https://arxiv.org/abs/2412.06412
      Code: https://github.com/Yu-Yang-Li/StarWhisper/tree/main/projects/ngss
      Journal: https://doi.org/10.1038/s44172-025-00520-4
    desc: LLM agent that plans observations, controls a 10-telescope network and runs transient detection for the Nearby Galaxy Supernovae Survey.
  - name: AstroAgents
    title: 'AstroAgents: A Multi-Agent AI for Hypothesis Generation from Mass Spectrometry Data'
    venue: arXiv 2025
    links:
      Paper: https://arxiv.org/abs/2503.23170
