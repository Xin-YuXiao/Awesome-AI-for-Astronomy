name: AstroAI Today

# Every day, collect new arXiv papers that apply machine learning to astronomy, summarise them,
# refresh the weekly and monthly digests, commit data/today/ and rebuild the web page.

on:
  # arXiv announces new papers at 20:00 US Eastern time, and GitHub may delay or skip a
  # scheduled run. The later runs pick up anything the first one missed; a run with nothing
  # new commits nothing.
  schedule:
    - cron: "41 2 * * *"
    - cron: "23 5 * * *"
    - cron: "37 11 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: Collect the last N days (first run only)
        default: "0"
      lookup:
        description: Only print arXiv metadata for these comma-separated ids
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: astroai-today
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Look up arXiv ids
        if: inputs.lookup != ''
        env:
          IDS: ${{ inputs.lookup }}
        run: python scripts/today.py --lookup "$IDS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect and summarise new papers
        if: inputs.lookup == ''
        env:
          # Summaries are written by DeepSeek when the repository secret DEEPSEEK_API_KEY is set.
          # LLM_API_KEY with the LLM_BASE_URL and LLM_MODEL repository variables selects another
          # OpenAI-compatible service; ANTHROPIC_API_KEY alone selects Claude.
          LLM_API_KEY: ${{ secrets.DEEPSEEK_API_KEY || secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL || 'https://api.deepseek.com' }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'deepseek-flash' }}
          # DeepSeek V4.1 Flash with thinking at medium effort, which DeepSeek runs as high.
          # Set the repository variable to low for cheaper runs, or to none to turn thinking off.
          LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT || 'medium' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional. Raises the Semantic Scholar rate limit for the TL;DR lookups.
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          BACKFILL: ${{ inputs.backfill || '0' }}
        run: python scripts/today.py --backfill "$BACKFILL"
      - name: Commit the new data and rebuild the web page
        if: inputs.lookup == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/today
          if git diff --cached --quiet; then
            echo "No new papers."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "AstroAI Today: $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
          gh workflow run build.yml --ref main
